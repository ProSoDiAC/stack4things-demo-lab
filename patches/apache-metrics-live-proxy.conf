# IoT Metrics Grafana dashboard — reverse proxy for Horizon iframe (same origin)
# Grafana runs with serve_from_sub_path: requests must keep the /horizon/metrics-live/ prefix.
<IfModule mod_proxy.c>
  ProxyPreserveHost On
  RequestHeader set X-Forwarded-Proto "http"
  RequestHeader set X-Forwarded-Host expr=%{HTTP_HOST}
  ProxyPass /horizon/metrics-live/ http://grafana:3000/horizon/metrics-live/
  ProxyPassReverse /horizon/metrics-live/ http://grafana:3000/horizon/metrics-live/
</IfModule>
